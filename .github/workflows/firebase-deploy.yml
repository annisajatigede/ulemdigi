name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          cd frontend && npm install

      - name: Build Frontend
        run: |
          cd frontend && npm run build

      - name: Deploy to Firebase Hosting
      run: |
          npx --yes firebase-tools deploy --only hosting --project forkoway --token "${{ secrets.FIREBASE_TOKEN }}"
