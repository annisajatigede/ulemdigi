<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="islamicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#islamicGrad)"/>
  
  <!-- Islamic Arch Outline -->
  <path d="M 120 360 L 120 180 C 120 90, 200 60, 300 40 C 400 60, 480 90, 480 180 L 480 360 Z" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  
  <text x="300" y="110" font-family="'Amiri', 'Traditional Arabic', serif" font-size="24" fill="#065f46" text-anchor="middle">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  <text x="300" y="150" font-family="'Playfair Display', serif" font-size="28" fill="#064e3b" text-anchor="middle" font-weight="bold">Islami Minimalis</text>
  <text x="300" y="180" font-family="sans-serif" font-size="13" fill="#047857" text-anchor="middle" letter-spacing="3">WALIMATUL 'URS</text>
  
  <line x1="220" y1="205" x2="380" y2="205" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="300" cy="205" r="4" fill="#059669"/>
  
  <text x="300" y="245" font-family="'Playfair Display', serif" font-size="22" fill="#0f172a" text-anchor="middle">Fulan &amp; Fulanah</text>
  <text x="300" y="280" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Elegan, Khidmat, &amp; Penuh Berkah</text>
  <text x="300" y="325" font-family="'Amiri', serif" font-size="15" fill="#047857" text-anchor="middle">بَارَكَ اللَّهُ لَكُمَا وَبَارَكَ عَلَيْكُمَا</text>
</svg>